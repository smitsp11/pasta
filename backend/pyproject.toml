[project]
name = "crucible"
version = "0.1.0"
description = "Lighthouse for AI agents: agent-readiness measured with real agents on Steel"
requires-python = ">=3.12"
dependencies = [
  "steel-sdk==0.19.0",
  "browser-use==0.13.10",
  "playwright>=1.50",
  "anthropic>=0.76.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["crucible*"]
